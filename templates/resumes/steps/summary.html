{% extends "resumes/wizard_base.html" %}
{% block title %}Summary — {{ resume.title }}{% endblock %}

{% block step_content %}
<form method="post" id="wizard-form">
  {% csrf_token %}

  <div style="margin-bottom:16px;">
    <div class="flex justify-between items-center" style="margin-bottom:6px;">
      <label for="id_summary" class="form-label" style="margin-bottom:0;">Professional Summary</label>
      <button type="button" id="ai-summary-btn"
              class="btn-ai"
              hx-post="{% url 'ai_assistant:enhance_summary' %}"
              hx-vals='{"field_id": "id_summary", "target_role": "{{ resume.target_role }}"}'
              hx-include="[name='summary']"
              hx-target="#id_summary"
              hx-swap="outerHTML"
              hx-indicator="#ai-spin">
        <span id="ai-spin" class="htmx-indicator">⏳</span>
        AI Improve
      </button>
    </div>
    <textarea id="id_summary" name="summary" rows="6"
              class="form-textarea"
              placeholder="A results-driven software engineer with 5+ years of experience building scalable web applications...">{{ personal_info.summary }}</textarea>
    <p class="t-small mt-2">
      Tip: 2–3 sentences. Quantify your impact. Target role:
      <strong style="color:var(--white);">{{ resume.target_role|default:"(not set)" }}</strong>
    </p>
  </div>

  <!-- Character counter -->
  <div class="flex justify-between items-center" style="font-size:12px; color:var(--gray); margin-bottom:16px;">
    <span id="char-count">0 characters</span>
    <span style="color:var(--yellow);">Aim for 200–400 characters</span>
  </div>

  <div style="text-align:right;">
    <button type="submit" name="save_draft" value="1" class="btn btn-outline btn-sm">Save Draft</button>
  </div>
</form>

<script>
  const ta = document.getElementById('id_summary');
  const counter = document.getElementById('char-count');
  function updateCount() { counter.textContent = ta.value.length + ' characters'; }
  ta.addEventListener('input', updateCount);
  updateCount();
</script>
{% endblock %}
