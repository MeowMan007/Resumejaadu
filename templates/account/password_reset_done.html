{% extends "base.html" %}

{% block title %}Check Your Email — ResumeJaadu{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-14rem)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md animate-slide-up">
    <div class="glass rounded-3xl p-8 sm:p-10 shadow-2xl border border-white/10 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl mb-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-2xl">
        ✉️
      </div>
      <h1 class="font-display text-2xl font-bold text-white mb-2">
        Check your email
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mb-6 leading-relaxed">
        We have sent you an email with instructions on how to reset your password. Please check your inbox (and spam folder).
      </p>
      <a href="{% url 'account_login' %}" class="btn-primary text-xs px-6 py-2.5">
        Return to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
