{% extends "base.html" %}

{% block title %}Check Your Email — ResumeJaadu{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 200px); display:flex; align-items:center; justify-content:center; padding: 48px 24px;">
  <div style="width: 100%; max-width: 400px;" class="anim-in">
    <div class="card" style="padding: 40px 36px; text-align: center;">
      <div style="font-size: 28px; margin-bottom: 12px;">✉️</div>
      <h1 class="t-heading" style="font-size: 22px; margin-bottom: 8px;">Check your email</h1>
      <p class="t-small mb-6" style="line-height: 1.6;">
        We sent you password reset instructions. Check your inbox and spam folder.
      </p>
      <a href="{% url 'account_login' %}" class="btn btn-primary btn-sm">Return to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
