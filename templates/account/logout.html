{% extends "base.html" %}

{% block title %}Sign Out — ResumeJaadu{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-14rem)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md animate-slide-up">
    <div class="glass rounded-3xl p-8 sm:p-10 shadow-2xl border border-white/10 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl mb-4 bg-red-500/10 border border-red-500/20 text-red-400 text-2xl">
        👋
      </div>
      <h1 class="font-display text-2xl font-bold text-white mb-2">
        Sign out of ResumeJaadu?
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mb-6">
        Are you sure you want to sign out? Your resume drafts are safely saved.
      </p>

      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <div class="flex items-center gap-3 justify-center">
          <a href="{% url 'resumes:dashboard' %}" class="btn-secondary text-xs px-5 py-2.5">
            Cancel
          </a>
          <button type="submit" class="btn-danger text-xs px-6 py-2.5">
            Yes, Sign Out
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
