{% extends "base.html" %}

{% block title %}Sign Out — ResumeJaadu{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 200px); display:flex; align-items:center; justify-content:center; padding: 48px 24px;">
  <div style="width: 100%; max-width: 400px;" class="anim-in">
    <div class="card" style="padding: 40px 36px; text-align: center;">
      <div style="font-size: 32px; margin-bottom: 16px;">👋</div>
      <h1 class="t-heading" style="font-size: 22px; margin-bottom: 8px;">Sign out?</h1>
      <p class="t-small mb-6">Your resume drafts are safely saved.</p>

      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <div class="flex justify-center gap-3">
          <a href="{% url 'resumes:dashboard' %}" class="btn btn-outline btn-sm">Cancel</a>
          <button type="submit" class="btn btn-danger btn-sm">Sign Out</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
